<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <base href="/" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  
  <!-- Preconnect to external domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Load fonts with display=swap for better performance -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" /></noscript>
  
  <!-- Inline critical CSS or load stylesheet asynchronously -->
  <link rel="stylesheet" href="/src/styles.scss" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="/src/styles.scss" /></noscript>

  <!-- Static Open Graph & Twitter Tags (images) -->
  <meta property="og:image" content="https://campusyatra.com/og-image.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://campusyatra.com/twitter-card.jpg">
  
  <!-- Note: Title, description, canonical, og:title, og:description, og:url, twitter:title, twitter:description are dynamically updated by SEOHead component -->

  <!-- SCHEMA MARKUP -->
  <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@type": "EducationalOrganization",
    "name": "CampusYatra",
    "url": "https://campusyatra.com",
    "logo": "https://campusyatra.com/logo.png",
    "sameAs": [
    "https://www.facebook.com/campusyatra1",
    "https://www.instagram.com/campusyatra1",
    "https://www.linkedin.com/company/campus-yatra",
    "https://www.youtube.com/@CampusYatra1",
    "https://twitter.com/campusyatra1",
    "https://www.quora.com/profile/Campus-Yatra-1",
    "https://medium.com/@campusyatra",
    "https://www.reddit.com/user/Pristine-Help-6121"
    ],
    "description": "CampusYatra helps students find and connect with top universities and study
    programs across the world."
    }
  </script>

  <!-- Google Tag Manager - Loaded after page load for better performance -->
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PKV95Z4Z" height="0" width="0"
      style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div id="root">
    <!-- Critical above-the-fold content - renders immediately before React -->
    <style>
      /* Critical CSS for hero section - inline for instant rendering */
      #root { min-height: 100vh; background: white; }
      .hero-critical {
        position: relative;
        width: 100%;
        min-height: 100vh;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }
      .hero-title {
        text-align: center;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: clamp(1.75rem, 5vw, 3rem);
        font-weight: 900;
        line-height: 1.1;
        color: #000;
        margin: 0 auto 1.5rem;
        max-width: 1200px;
        letter-spacing: -0.02em;
      }
      .hero-title .gradient-text {
        background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .loading-skeleton { 
        display: none; /* Hide skeleton when hero is visible */
      }
      /* Hide critical hero when React takes over */
      .react-loaded .hero-critical {
        display: none;
      }
      @keyframes loading {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
    <!-- Critical hero content - renders immediately -->
    <div class="hero-critical">
      <h1 class="hero-title">
        Get Admission to Your <span class="gradient-text">Dream College</span> with Expert Guidance
      </h1>
    </div>
    <!-- Loading skeleton for below-the-fold -->
    <div class="loading-skeleton" style="display: none;"></div>
  </div>
  <!-- Defer main script to improve initial render -->
  <script type="module" src="/src/main.tsx" defer></script>
  
  <!-- Load Google Tag Manager after page is interactive -->
  <script>
    // Load GTM after page load to improve initial render performance
    window.addEventListener('load', function() {
      (function (w, d, s, l, i) {
        w[l] = w[l] || []; w[l].push({
          'gtm.start': new Date().getTime(), 
          event: 'gtm.js'
        }); 
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s), 
          dl = l != 'dataLayer' ? '&l=' + l : ''; 
        j.async = true; 
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl; 
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', 'GTM-PKV95Z4Z');
    });
  </script>
</body>

</html>
